<meta charset="utf-8">
<title>DORIC — Ευρετήριο</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DORIC">
<meta name="theme-color" content="#1F3A5F">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --navy:#1F3A5F; --navy2:#2C4E7A; --olive:#A9A233; --olive-d:#8A8429;
  --bg:#F5F5F0; --card:#FFFFFF; --line:#DEDED4; --ink:#1A1A1A; --muted:#7A7A70;
  --ok:#2E7D32; --warn:#B8860B; --bad:#9C3428;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px;padding-bottom:82px}
h1,h2,h3{margin:0}
button{font-family:inherit;font-size:16px;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;width:100%;padding:11px 12px;
  border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--navy2);outline-offset:-1px}
textarea{min-height:76px;resize:vertical}
input[type=file]{padding:9px;font-size:14px}

.hdr{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
  display:flex;align-items:center;gap:10px;box-shadow:0 1px 6px rgba(0,0,0,.18)}
.mark{width:30px;height:30px;flex:0 0 30px}
.hdr .t{font-size:17px;font-weight:700;letter-spacing:.06em}
.hdr .s{font-size:11px;color:#B9C6D6;letter-spacing:.14em;margin-top:1px}
.hdr .sp{margin-left:auto}
.iconbtn{background:rgba(255,255,255,.14);border-radius:9px;padding:8px 11px;font-size:14px;color:#fff}

.wrap{padding:14px 14px 20px;max-width:760px;margin:0 auto}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;
  border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;padding:9px 4px 8px;color:var(--muted);font-size:11px;
  display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600;letter-spacing:.04em}
.tabbar button .ic{font-size:19px;line-height:1}
.tabbar button.on{color:var(--navy)}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:11px}
.rowbtw{display:flex;align-items:center;justify-content:space-between;gap:10px}
.name{font-weight:700;font-size:17px;line-height:1.25}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
.chev{color:var(--muted);font-size:20px;flex:0 0 auto}

/* region card (drill-down) */
.rcard{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--olive);
  border-radius:14px;padding:16px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.rcard .rn{font-weight:800;font-size:17px;letter-spacing:.02em}
.rcard .rs{color:var(--muted);font-size:13px;margin-top:2px}
.rcard .num{background:#EFF1E6;color:#4A5220;font-weight:800;border-radius:9px;
  padding:6px 11px;font-size:15px;flex:0 0 auto}

.crumb{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.crumb button{background:#fff;border:1px solid var(--line);border-radius:9px;
  padding:8px 12px;font-size:14px;font-weight:600;color:var(--navy)}
.crumb .here{font-weight:800;color:var(--navy);font-size:15px;letter-spacing:.02em}

.btn{background:var(--navy);color:#fff;border-radius:11px;padding:13px 16px;
  font-weight:700;width:100%;text-align:center;letter-spacing:.02em}
.btn.olive{background:var(--olive-d)}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.danger{background:#fff;color:var(--bad);border:1.5px solid var(--bad)}
.btn.sm{padding:9px 13px;font-size:14px;width:auto;display:inline-block}
.btnrow{display:flex;gap:9px;margin-top:12px}
.btnrow .btn{flex:1}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.chip{background:#EFF1E6;border:1px solid #DDE0CC;color:#4A5220;border-radius:8px;
  padding:4px 9px;font-size:12px;font-weight:700}
.chip.blue{background:#EAEFF6;border-color:#D3DEEC;color:var(--navy)}
.chip.bio{background:#E8F3E9;border-color:#CBE3CD;color:var(--ok)}
.chip.pdf{background:#FBEEE6;border-color:#EFD9C8;color:#8A4B2F}

.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;background:#FCFCF9}
.item .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.item .tt{font-weight:700;font-size:15px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mini{background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 9px}
.mini .k{font-size:10px;color:var(--muted);letter-spacing:.09em;font-weight:700}
.mini .v{font-size:16px;font-weight:700;margin-top:2px}
.mini .v.ok{color:var(--ok)} .mini .v.warn{color:var(--warn)} .mini .v.bad{color:var(--bad)}

.f{margin-bottom:11px}
.f label{display:block;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.07em;margin-bottom:5px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:11px;color:var(--muted);margin-top:4px}
.sect{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--navy);
  margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.chkrow{display:flex;align-items:center;gap:10px;padding:11px 0}
.chkrow input{width:22px;height:22px;flex:0 0 22px}
.chkrow span{font-size:15px;font-weight:600}

.empty{text-align:center;padding:42px 18px;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:10px}
.empty p{margin:0 0 16px;font-size:14px;line-height:1.5}

.sheet{position:fixed;inset:0;z-index:60;background:rgba(20,24,30,.45);display:flex;align-items:flex-end}
.sheet .in{background:var(--bg);width:100%;
  max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;
  padding:22px 14px 0;-webkit-overflow-scrolling:touch}
.sheet h3{font-size:19px;font-weight:800;margin-bottom:16px}
/* Οι ενέργειες μένουν ΚΑΤΩ, πάντα ορατές, χωρίς να τις κρύβει τίποτα */
.acts{position:sticky;bottom:0;z-index:6;background:var(--bg);
  display:flex;gap:10px;margin-top:20px;
  padding:12px 0 calc(env(safe-area-inset-bottom) + 12px);
  border-top:1px solid var(--line);
  box-shadow:0 -8px 14px -10px rgba(0,0,0,.22)}
.acts .btn{flex:1;padding:15px 12px;font-size:17px}
.ver{text-align:center;color:var(--muted);font-size:11px;padding:18px 0 4px;letter-spacing:.08em}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:80;
  background:var(--navy);color:#fff;padding:11px 18px;border-radius:11px;font-size:14px;
  font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:88%;text-align:center}
.load{text-align:center;padding:50px;color:var(--muted)}
.filt{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:11px}
.filt .more{color:var(--navy);font-weight:700;font-size:14px;padding:8px 0}
</style>

<div class="hdr">
  <svg class="mark" viewBox="0 0 600 540"><g>
    <path d="M300 60C452 60 516 158 516 268S452 476 300 476v-52c102 0 156-68 156-156S402 112 300 112Z" fill="#A9A233"/>
    <path d="M176 60h124v52h-72v312h72v52H176Z" fill="#fff"/>
    <rect x="236" y="150" width="164" height="22" rx="3" fill="#A9A233"/>
    <path d="M246 172h144l-10 20H256Z" fill="#A9A233"/>
    <path d="M286 198h64l-5 194h-54Z" fill="#A9A233"/>
    <path d="M302 202l1.5 186M318 202v186M334 202l-1.5 186" stroke="#1F3A5F" stroke-width="7"/>
    <rect x="276" y="398" width="84" height="14" rx="2" fill="#A9A233"/>
  </g></svg>
  <div><div class="t" id="hT">DORIC</div><div class="s" id="hS">ΕΥΡΕΤΗΡΙΟ</div></div>
  <div class="sp"></div>
  <button class="iconbtn" onclick="openBackup()">Αντίγραφο</button>
</div>

<div id="app"><div class="load">Φόρτωση…</div></div>

<div class="tabbar">
  <button id="tb-prod" onclick="go('prod')"><span class="ic">🫒</span>ΠΑΡΑΓΩΓΟΙ</button>
  <button id="tb-cli" onclick="go('cli')"><span class="ic">🤝</span>ΠΕΛΑΤΕΣ</button>
  <button id="tb-find" onclick="go('find')"><span class="ic">🔍</span>ΤΑΙΡΙΑΣΜΑ</button>
</div>

<script>
const KEY='doric-index-v1';
const APP_V='v6';
let D={pRegions:[],producers:[],cRegions:[],clients:[]};
let view='prod', nav=null, ready=false;   // nav = {kind:'pregion'|'producer'|'cregion'|'client', id}

/* ================= ΑΠΟΘΗΚΕΥΣΗ ΕΓΓΡΑΦΩΝ ================= */
function load(){
  try{
    const v=localStorage.getItem(KEY);
    if(v) D=Object.assign({pRegions:[],producers:[],cRegions:[],clients:[]},JSON.parse(v));
  }catch(e){}
  ready=true; render();
}
let saveTimer=null;
function save(msg){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{ localStorage.setItem(KEY,JSON.stringify(D)); }
    catch(e){ toast('Δεν αποθηκεύτηκε — ίσως γέμισε η μνήμη'); }
  },120);
  if(msg) toast(msg);
}

/* ================= ΑΠΟΘΗΚΕΥΣΗ ΑΡΧΕΙΩΝ (PDF) ================= */
let _db=null, filesOK=(typeof indexedDB!=='undefined');
function db(){
  return new Promise((res,rej)=>{
    if(_db) return res(_db);
    try{
      const q=indexedDB.open('doric-files',1);
      q.onupgradeneeded=()=>{ if(!q.result.objectStoreNames.contains('f')) q.result.createObjectStore('f'); };
      q.onsuccess=()=>{ _db=q.result; res(_db); };
      q.onerror=()=>rej(q.error);
    }catch(e){ rej(e); }
  });
}
async function putFile(id,rec){
  const d=await db();
  return new Promise((res,rej)=>{ const t=d.transaction('f','readwrite');
    t.objectStore('f').put(rec,id); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); });
}
async function getFile(id){
  const d=await db();
  return new Promise((res,rej)=>{ const t=d.transaction('f','readonly');
    const r=t.objectStore('f').get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
}
async function dropFile(id){
  if(!id) return;
  try{ const d=await db();
    await new Promise(res=>{ const t=d.transaction('f','readwrite');
      t.objectStore('f').delete(id); t.oncomplete=res; t.onerror=res; });
  }catch(e){}
}
async function showFile(id,name){
  try{
    const rec=await getFile(id);
    if(!rec){ toast('Το αρχείο δεν βρέθηκε'); return; }
    const url=URL.createObjectURL(rec.blob);
    const a=document.createElement('a');
    a.href=url; a.download=name||rec.name||'analysis.pdf'; a.target='_blank';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
  }catch(e){ toast('Δεν άνοιξε το αρχείο'); }
}

function toast(t){
  const d=document.createElement('div'); d.className='toast'; d.textContent=t;
  document.body.appendChild(d); setTimeout(()=>d.remove(),2100);
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n;};

/* ---------- custom confirm ---------- */
function ask(msg,onYes){
  const w=document.createElement('div'); w.className='sheet';
  w.innerHTML=`<div class="in"><h3>${esc(msg)}</h3>
    <div class="acts"><button class="btn ghost" id="no">Άκυρο</button>
    <button class="btn danger" id="yes">Διαγραφή</button></div></div>`;
  w.addEventListener('click',e=>{ if(e.target===w) w.remove(); });
  document.body.appendChild(w);
  w.querySelector('#no').onclick=()=>w.remove();
  w.querySelector('#yes').onclick=()=>{ w.remove(); onYes(); };
}

/* ---------- πλοήγηση ---------- */
function go(v){ view=v; nav=null; render(); window.scrollTo(0,0); }
function openRec(kind,id){ nav={kind,id}; render(); window.scrollTo(0,0); }
function back(){
  if(!nav) return;
  if(nav.kind==='producer'){ const p=D.producers.find(x=>x.id===nav.id); nav={kind:'pregion',id:p?p.region:null}; }
  else if(nav.kind==='client'){ const c=D.clients.find(x=>x.id===nav.id); nav={kind:'cregion',id:c?c.region:null}; }
  else nav=null;
  render(); window.scrollTo(0,0);
}

/* ---------- χρώματα ποιότητας ---------- */
function acidCls(v){const n=num(v);return n===null?'':(n<=0.4?'ok':(n<=0.8?'warn':'bad'));}
function peroxCls(v){const n=num(v);return n===null?'':(n<=12?'ok':(n<=20?'warn':'bad'));}
function k270Cls(v){const n=num(v);return n===null?'':(n<=0.18?'ok':(n<=0.22?'warn':'bad'));}
function polyCls(v){const n=num(v);return n===null?'':(n>=250?'ok':'');}

/* ================= RENDER ================= */
function render(){
  const el=document.getElementById('app');
  if(!ready){ el.innerHTML='<div class="load">Φόρτωση…</div>'; return; }
  document.getElementById('tb-prod').className = view==='prod'?'on':'';
  document.getElementById('tb-cli').className  = view==='cli'?'on':'';
  document.getElementById('tb-find').className = view==='find'?'on':'';

  if(nav){
    if(nav.kind==='pregion') el.innerHTML=pRegionPage(nav.id);
    else if(nav.kind==='producer') el.innerHTML=producerPage(nav.id);
    else if(nav.kind==='cregion') el.innerHTML=cRegionPage(nav.id);
    else if(nav.kind==='client') el.innerHTML=clientPage(nav.id);
    setHdr(); return;
  }
  if(view==='prod') el.innerHTML=prodRegions();
  else if(view==='cli') el.innerHTML=cliRegions();
  else { el.innerHTML=findPage(); fillFind(); }
  el.innerHTML+=`<div class="ver">DORIC ΕΥΡΕΤΗΡΙΟ · ${APP_V}</div>`;
  setHdr();
}
function setHdr(){
  const m={prod:'ΠΑΡΑΓΩΓΟΙ',cli:'ΠΕΛΑΤΕΣ',find:'ΤΑΙΡΙΑΣΜΑ'};
  document.getElementById('hT').textContent='DORIC';
  document.getElementById('hS').textContent=m[view]||'ΕΥΡΕΤΗΡΙΟ';
}

/* ================= ΠΑΡΑΓΩΓΟΙ: περιοχές ================= */
function prodRegions(){
  let h='<div class="wrap">';
  if(!D.pRegions.length){
    h+=`<div class="empty"><div class="big">🗺️</div>
      <p>Ξεκίνα φτιάχνοντας τις περιοχές σου — π.χ. Μολάοι, Σκάλα, Γύθειο.<br>
      Μετά μπαίνεις σε κάθε περιοχή και βάζεις τους παραγωγούς της.</p></div>
      <button class="btn" onclick="addRegion('p')">+ Νέα περιοχή</button></div>`;
    return h;
  }
  D.pRegions.forEach(r=>{
    const list=D.producers.filter(p=>p.region===r.id);
    const oils=list.reduce((s,p)=>s+((p.oils||[]).length),0);
    const tons=list.reduce((s,p)=>s+(p.oils||[]).reduce((t,o)=>t+(num(o.qty)||0),0),0);
    h+=`<div class="rcard" onclick="openRec('pregion','${r.id}')">
      <div style="flex:1;min-width:0">
        <div class="rn">${esc(r.name)}</div>
        <div class="rs">${list.length} παραγωγοί · ${oils} λάδια${tons?' · '+tons.toFixed(1)+' τν':''}</div>
      </div>
      <div class="num">${list.length}</div><div class="chev">›</div></div>`;
  });
  h+=`<button class="btn ghost" style="margin-top:16px" onclick="addRegion('p')">+ Νέα περιοχή</button></div>`;
  return h;
}

function pRegionPage(rid){
  const r=D.pRegions.find(x=>x.id===rid); if(!r){go('prod');return'';}
  const list=D.producers.filter(p=>p.region===rid);
  let h=`<div class="wrap">
    <div class="crumb"><button onclick="go('prod')">‹ Περιοχές</button>
      <span class="here">${esc(r.name)}</span></div>`;
  if(!list.length) h+=`<div class="empty"><div class="big">🫒</div>
    <p>Καμία καταχώρηση σε αυτή την περιοχή ακόμα.</p></div>`;
  list.forEach(p=>{
    const oils=p.oils||[];
    const tons=oils.reduce((s,o)=>s+(num(o.qty)||0),0);
    h+=`<div class="card" onclick="openRec('producer','${p.id}')">
      <div class="rowbtw"><div style="min-width:0">
        <div class="name">${esc(p.name)}</div>
        <div class="sub">${esc(p.type||'—')}${p.contact?' · '+esc(p.contact):''}</div>
        <div class="chips">
          <span class="chip">${oils.length} λάδια</span>
          ${tons?`<span class="chip blue">${tons.toFixed(1)} τν</span>`:''}
          ${oils.some(o=>o.bio)?'<span class="chip bio">ΒΙΟ</span>':''}
          ${oils.some(o=>o.fileId)?'<span class="chip pdf">📄</span>':''}
        </div></div><div class="chev">›</div></div></div>`;
  });
  h+=`<div class="btnrow" style="margin-top:16px">
      <button class="btn" onclick="addProducer('${rid}')">+ Παραγωγός</button>
      <button class="btn danger sm" onclick="delRegion('p','${rid}')">Διαγραφή περιοχής</button>
    </div></div>`;
  return h;
}

function producerPage(id){
  const p=D.producers.find(x=>x.id===id); if(!p){go('prod');return'';}
  const r=D.pRegions.find(x=>x.id===p.region);
  let h=`<div class="wrap">
    <div class="crumb"><button onclick="go('prod')">Περιοχές</button>
      <button onclick="openRec('pregion','${p.region}')">‹ ${esc(r?r.name:'—')}</button></div>
    <div class="card">
      <div class="name" style="font-size:20px">${esc(p.name)}</div>
      <div class="sub">${esc(p.type||'—')}</div>
      ${p.contact?`<div class="sub">Επαφή: ${esc(p.contact)}</div>`:''}
      ${p.phone?`<div class="sub"><a href="tel:${esc(p.phone)}" style="color:var(--navy);font-weight:700">${esc(p.phone)}</a></div>`:''}
      ${p.notes?`<div class="sub" style="margin-top:8px;color:var(--ink)">${esc(p.notes)}</div>`:''}
      <div class="btnrow">
        <button class="btn ghost sm" onclick="editProducer('${p.id}')">Επεξεργασία</button>
        <button class="btn danger sm" onclick="delProducer('${p.id}')">Διαγραφή</button>
      </div>
    </div>
    <div class="sect">ΔΙΑΘΕΣΙΜΑ ΛΑΔΙΑ</div>`;
  const oils=p.oils||[];
  if(!oils.length) h+=`<div class="card" style="color:var(--muted);font-size:14px">Δεν έχεις καταχωρήσει λάδια. Πάτα «+ Λάδι».</div>`;
  oils.forEach(o=>{ h+=oilCard(p.id,o); });
  h+=`<button class="btn olive" style="margin-top:14px" onclick="addOil('${p.id}')">+ Λάδι</button></div>`;
  return h;
}

function oilCard(pid,o){
  return `<div class="item">
    <div class="top"><div>
      <div class="tt">${esc(o.name||'Παρτίδα')}</div>
      <div class="sub">${esc(o.variety||'—')} · ${esc(o.cat||'—')}${o.harvest?' · '+esc(o.harvest):''}</div>
    </div>
    <div style="text-align:right">
      <div style="font-weight:800;font-size:17px">${o.qty?esc(o.qty)+' τν':'—'}</div>
      ${o.price?`<div class="sub">${esc(o.price)} €/κιλό</div>`:''}
    </div></div>
    <div class="grid4">
      <div class="mini"><div class="k">ΟΞΥΤΗΤΑ</div><div class="v ${acidCls(o.acid)}">${o.acid?esc(o.acid):'—'}</div></div>
      <div class="mini"><div class="k">ΥΠΕΡΟΞΕΙΔΙΑ</div><div class="v ${peroxCls(o.perox)}">${o.perox?esc(o.perox):'—'}</div></div>
      <div class="mini"><div class="k">K270</div><div class="v ${k270Cls(o.k270)}">${o.k270?esc(o.k270):'—'}</div></div>
      <div class="mini"><div class="k">ΠΟΛΥΦΑΙΝΟΛΕΣ</div><div class="v ${polyCls(o.poly)}">${o.poly?esc(o.poly):'—'}</div></div>
    </div>

function clearF(){ F={acid:'',perox:'',k270:'',poly:'',qty:'',price:'',cat:'',variety:'',harvest:'',region:'',bio:false,pdf:false,more:F.more}; render(); }
function fillFind(){ const el=document.getElementById('res'); if(el) el.innerHTML=findResults(); }

function findResults(){
  const all=[];
  D.producers.forEach(p=>(p.oils||[]).forEach(o=>all.push({p,o})));
  const res=all.filter(({p,o})=>{
    const a=num(F.acid), pe=num(F.perox), k=num(F.k270), po=num(F.poly), q=num(F.qty), pr=num(F.price);
    if(a!==null  && (num(o.acid)===null  || num(o.acid)>a))   return false;
    if(pe!==null && (num(o.perox)===null || num(o.perox)>pe)) return false;
    if(k!==null  && (num(o.k270)===null  || num(o.k270)>k))   return false;
    if(po!==null && (num(o.poly)===null  || num(o.poly)<po))  return false;
    if(q!==null  && (num(o.qty)===null   || num(o.qty)<q))    return false;
    if(pr!==null && (num(o.price)===null || num(o.price)>pr)) return false;
    if(F.cat && o.cat!==F.cat) return false;
    if(F.harvest && o.harvest!==F.harvest) return false;
    if(F.variety && !(o.variety||'').toLowerCase().includes(F.variety.toLowerCase())) return false;
    if(F.region && p.region!==F.region) return false;
    if(F.bio && !o.bio) return false;
    if(F.pdf && !o.fileId) return false;
    return true;
  });
  res.sort((x,y)=>(num(x.o.acid)??9)-(num(y.o.acid)??9));

  const tot=res.reduce((s,{o})=>s+(num(o.qty)||0),0);
  let h=`<div class="sect">ΒΡΕΘΗΚΑΝ ${res.length}${tot?' · '+tot.toFixed(1)+' ΤΝ ΣΥΝΟΛΟ':''}</div>`;
  if(!all.length) return h+`<div class="empty"><div class="big">🫗</div><p>Δεν υπάρχουν ακόμα λάδια καταχωρημένα.</p></div>`;
  if(!res.length) return h+`<div class="card" style="color:var(--muted);font-size:14px">Καμία παρτίδα δεν πληροί τα κριτήρια. Χαλάρωσε κάποιο φίλτρο.</div>`;
  res.forEach(({p,o})=>{
    const r=D.pRegions.find(x=>x.id===p.region);
    h+=`<div class="card" onclick="openRec('producer','${p.id}')">
      <div class="rowbtw"><div style="min-width:0">
        <div class="name">${esc(o.name||'Παρτίδα')}</div>
        <div class="sub">${esc(p.name)} · ${esc(r?r.name:'—')}</div>
        <div class="chips">
          <span class="chip blue">οξ. ${o.acid?esc(o.acid):'—'}</span>
          ${o.perox?`<span class="chip">υπ. ${esc(o.perox)}</span>`:''}
          ${o.k270?`<span class="chip">K270 ${esc(o.k270)}</span>`:''}
          ${o.poly?`<span class="chip">${esc(o.poly)} mg/kg</span>`:''}
          <span class="chip">${o.qty?esc(o.qty)+' τν':'—'}</span>
          ${o.price?`<span class="chip">${esc(o.price)} €</span>`:''}
          ${o.bio?'<span class="chip bio">ΒΙΟ</span>':''}
          ${o.fileId?'<span class="chip pdf">📄</span>':''}
        </div></div><div class="chev">›</div></div></div>`;
  });
  return h;
}

/* ================= ΦΟΡΜΕΣ ================= */
function sheet(title,body,onSave){
  const w=document.createElement('div'); w.className='sheet';
  w.innerHTML=`<div class="in">
    <h3>${esc(title)}</h3>${body}
    <div class="acts">
      <button class="btn ghost" onclick="this.closest('.sheet').remove()">Άκυρο</button>
      <button class="btn" id="sv">Αποθήκευση</button>
    </div></div>`;
  w.addEventListener('click',e=>{ if(e.target===w) w.remove(); });
  document.body.appendChild(w);
  w.querySelector('#sv').onclick=async()=>{
    const btn=w.querySelector('#sv'); btn.textContent='…';
    let r; try{ r=await onSave(w); }catch(e){ r=false; toast('Κάτι πήγε στραβά'); }
    btn.textContent='Αποθήκευση';
    if(r===false) return;
    w.remove(); render();
  };
  return w;
}
const val=(w,n)=>{const e=w.querySelector('[name="'+n+'"]');return e?(e.type==='checkbox'?e.checked:e.value.trim()):'';};
function fld(label,name,v,ph,type){
  return `<div class="f"><label>${label}</label><input name="${name}" value="${esc(v||'')}"
    placeholder="${ph||''}" ${type==='num'?'inputmode="decimal"':''} ${type==='date'?'type="date"':''}></div>`;
}
function area(label,name,v,ph){
  return `<div class="f"><label>${label}</label><textarea name="${name}" placeholder="${ph||''}">${esc(v||'')}</textarea></div>`;
}
function sel(label,name,v,opts){
  return `<div class="f"><label>${label}</label><select name="${name}">
    ${opts.map(o=>`<option value="${esc(o.v)}" ${o.v===v?'selected':''}>${esc(o.t)}</option>`).join('')}
  </select></div>`;
}
function chk(label,name,v){
  return `<div class="chkrow"><input type="checkbox" name="${name}" ${v?'checked':''}><span>${label}</span></div>`;
}
function fileFld(cur){
  return `<div class="f"><label>ΑΡΧΕΙΟ ΑΝΑΛΥΣΗΣ (PDF Ή ΦΩΤΟ)</label>
    <input type="file" name="file" accept="application/pdf,image/*">
    ${cur?`<div class="hint">Υπάρχει ήδη: <b>${esc(cur)}</b>. Διάλεξε νέο για αντικατάσταση.</div>`:
          `<div class="hint">Προαιρετικό. Αποθηκεύεται μέσα στη συσκευή.</div>`}
    ${cur?`<div class="chkrow"><input type="checkbox" name="delfile"><span>Αφαίρεση αρχείου</span></div>`:''}
  </div>`;
}
async function handleFile(w,rec){
  const inp=w.querySelector('[name="file"]');
  const f=inp&&inp.files&&inp.files[0];
  if(val(w,'delfile')){ await dropFile(rec.fileId); rec.fileId=null; rec.fileName=null; return; }
  if(!f) return;
  if(!filesOK){ toast('Η συσκευή δεν υποστηρίζει αποθήκευση αρχείων'); return; }
  if(f.size>8*1024*1024){ toast('Πολύ μεγάλο αρχείο (πάνω από 8MB)'); return; }
  const id=rec.fileId||uid();
  await putFile(id,{name:f.name,type:f.type,blob:f});
  rec.fileId=id; rec.fileName=f.name;
}

/* --- περιοχές --- */
function addRegion(kind){
  sheet(kind==='p'?'Νέα περιοχή παραγωγών':'Νέα περιοχή πελατών',
    fld('ΟΝΟΜΑ ΠΕΡΙΟΧΗΣ','name','', kind==='p'?'π.χ. Μολάοι':'π.χ. Puglia'),
    w=>{ const n=val(w,'name'); if(!n){toast('Γράψε όνομα');return false;}
      (kind==='p'?D.pRegions:D.cRegions).push({id:uid(),name:n}); save('Η περιοχή προστέθηκε'); });
}
function delRegion(kind,id){
  const arr=kind==='p'?D.producers:D.clients;
  if(arr.some(x=>x.region===id)) return toast('Η περιοχή έχει καταχωρήσεις — σβήσ\'τες πρώτα');
  ask('Διαγραφή περιοχής;',()=>{
    if(kind==='p') D.pRegions=D.pRegions.filter(r=>r.id!==id);
    else D.cRegions=D.cRegions.filter(r=>r.id!==id);
    save('Διαγράφηκε'); go(kind==='p'?'prod':'cli');
  });
}

/* --- παραγωγός --- */
function producerForm(p){
  const ro=D.pRegions.map(r=>({v:r.id,t:r.name}));
  return sel('ΠΕΡΙΟΧΗ','region',p?p.region:'',ro)
    +fld('ΕΠΩΝΥΜΙΑ / ΟΝΟΜΑ','name',p&&p.name,'π.χ. Ελαιοτριβείο Κορμπάκη')
    +sel('ΤΥΠΟΣ','type',p?p.type:'Ελαιοτριβείο',
        ['Ελαιοτριβείο','Παραγωγός','Συνεταιρισμός','Έμπορος'].map(t=>({v:t,t})))
    +fld('ΥΠΕΥΘΥΝΟΣ ΕΠΑΦΗΣ','contact',p&&p.contact,'όνομα')
    +fld('ΤΗΛΕΦΩΝΟ','phone',p&&p.phone,'')
    +area('ΣΗΜΕΙΩΣΕΙΣ','notes',p&&p.notes,'δεξαμενές INOX; άζωτο; δέχεται δειγματοληψία; εντυπώσεις');
}
function addProducer(rid){
  if(!D.pRegions.length) return toast('Φτιάξε πρώτα μια περιοχή');
  const w=sheet('Νέος παραγωγός',producerForm(rid?{region:rid}:null),w=>{
    const n=val(w,'name'); if(!n){toast('Γράψε όνομα');return false;}
    const id=uid();
    D.producers.push({id,region:val(w,'region'),name:n,type:val(w,'type'),
      contact:val(w,'contact'),phone:val(w,'phone'),notes:val(w,'notes'),oils:[]});
    save('Ο παραγωγός προστέθηκε');
  });
  return w;
}
function editProducer(id){
  const p=D.producers.find(x=>x.id===id);
  sheet('Επεξεργασία παραγωγού',producerForm(p),w=>{
    const n=val(w,'name'); if(!n){toast('Γράψε όνομα');return false;}
    Object.assign(p,{region:val(w,'region'),name:n,type:val(w,'type'),
      contact:val(w,'contact'),phone:val(w,'phone'),notes:val(w,'notes')});
    save('Αποθηκεύτηκε');
  });
}
function delProducer(id){
  ask('Διαγραφή παραγωγού και όλων των λαδιών του;',async()=>{
    const p=D.producers.find(x=>x.id===id);
    if(p) for(const o of (p.oils||[])) await dropFile(o.fileId);
    const rid=p?p.region:null;
    D.producers=D.producers.filter(x=>x.id!==id); save('Διαγράφηκε');
    if(rid) openRec('pregion',rid); else go('prod');
  });
}

/* --- λάδι --- */
function oilForm(o){
  return fld('ΟΝΟΜΑ / ΠΑΡΤΙΔΑ','name',o&&o.name,'π.χ. Δεξαμενή 3 — Νοε 2026')
    +`<div class="f2">
      ${fld('ΠΟΙΚΙΛΙΑ','variety',o&&o.variety,'Κορωνέικη')}
      ${sel('ΚΑΤΗΓΟΡΙΑ','cat',o?o.cat:'Έξτρα παρθένο',
        ['Έξτρα παρθένο','Παρθένο','Λαμπάντε'].map(t=>({v:t,t})))}
    </div>
    <div class="f2">
      ${sel('ΣΥΓΚΟΜΙΔΗ','harvest',o?o.harvest:'',
        [{v:'',t:'—'},{v:'Πρώιμη',t:'Πρώιμη'},{v:'Όψιμη',t:'Όψιμη'}])}
      ${fld('ΠΟΣΟΤΗΤΑ (ΤΝ)','qty',o&&o.qty,'22','num')}
    </div>`
    +`<div class="sect">ΑΝΑΛΥΣΗ</div>
    <div class="f2">
      ${fld('ΟΞΥΤΗΤΑ (%)','acid',o&&o.acid,'0,30','num')}
      ${fld('ΥΠΕΡΟΞΕΙΔΙΑ','perox',o&&o.perox,'8','num')}
    </div>
    <div class="f2">
      ${fld('K270','k270',o&&o.k270,'0,15','num')}
      ${fld('ΠΟΛΥΦΑΙΝΟΛΕΣ (mg/kg)','poly',o&&o.poly,'420','num')}
    </div>
    <div class="f2">
      ${fld('ΕΡΓΑΣΤΗΡΙΟ','lab',o&&o.lab,'')}
      ${fld('ΗΜ/ΝΙΑ ΑΝΑΛΥΣΗΣ','adate',o&&o.adate,'','date')}
    </div>`
    +fileFld(o&&o.fileName)
    +fld('ΤΙΜΗ (€/ΚΙΛΟ)','price',o&&o.price,'4,10','num')
    +chk('Βιολογικό','bio',o&&o.bio)
    +area('ΣΗΜΕΙΩΣΕΙΣ','notes',o&&o.notes,'γευστικές νότες, πού φυλάσσεται το χαρτί, όροι');
}
function oilFrom(w){
  return {name:val(w,'name'),variety:val(w,'variety'),cat:val(w,'cat'),harvest:val(w,'harvest'),
    qty:val(w,'qty'),acid:val(w,'acid'),perox:val(w,'perox'),k270:val(w,'k270'),poly:val(w,'poly'),
    lab:val(w,'lab'),adate:val(w,'adate'),price:val(w,'price'),bio:val(w,'bio'),notes:val(w,'notes')};
}
function addOil(pid){
  const p=D.producers.find(x=>x.id===pid);
  sheet('Νέο λάδι',oilForm(null),async w=>{
    const o=oilFrom(w); if(!o.name){toast('Γράψε όνομα παρτίδας');return false;}
    o.id=uid(); await handleFile(w,o);
    p.oils=p.oils||[]; p.oils.push(o); save('Το λάδι προστέθηκε');
  });
}
function editOil(pid,oid){
  const p=D.producers.find(x=>x.id===pid); const o=p.oils.find(x=>x.id===oid);
  sheet('Επεξεργασία λαδιού',oilForm(o),async w=>{
    const n=oilFrom(w); if(!n.name){toast('Γράψε όνομα παρτίδας');return false;}
    Object.assign(o,n); await handleFile(w,o); save('Αποθηκεύτηκε');
  });
}
function delOil(pid,oid){
  ask('Διαγραφή λαδιού;',async()=>{
    const p=D.producers.find(x=>x.id===pid);
    const o=p.oils.find(x=>x.id===oid); await dropFile(o&&o.fileId);
    p.oils=p.oils.filter(x=>x.id!==oid); save('Διαγράφηκε'); render();
  });
}

/* --- πελάτης --- */
function clientForm(c){
  const ro=D.cRegions.map(r=>({v:r.id,t:r.name}));
  return sel('ΠΕΡΙΟΧΗ','region',c?c.region:'',ro)
    +fld('ΕΠΩΝΥΜΙΑ','name',c&&c.name,'π.χ. Oleificio Rossi')
    +fld('ΠΟΛΗ','city',c&&c.city,'Bari')
    +fld('ΥΠΕΥΘΥΝΟΣ ΕΠΑΦΗΣ','contact',c&&c.contact,'')
    +`<div class="f2">${fld('ΤΗΛΕΦΩΝΟ','phone',c&&c.phone,'')}${fld('EMAIL','email',c&&c.email,'')}</div>`
    +area('ΤΙ ΨΑΧΝΕΙ','wants',c&&c.wants,'π.χ. απαλό προφίλ, οξύτητα έως 0,4, 40-60 τν/έτος')
    +area('ΣΗΜΕΙΩΣΕΙΣ','notes',c&&c.notes,'όροι πληρωμής, ιστορικό, εντυπώσεις');
}
function addClient(rid){
  if(!D.cRegions.length) return toast('Φτιάξε πρώτα μια περιοχή');
  sheet('Νέος πελάτης',clientForm(rid?{region:rid}:null),w=>{
    const n=val(w,'name'); if(!n){toast('Γράψε επωνυμία');return false;}
    D.clients.push({id:uid(),region:val(w,'region'),name:n,city:val(w,'city'),
      contact:val(w,'contact'),phone:val(w,'phone'),email:val(w,'email'),
      wants:val(w,'wants'),notes:val(w,'notes'),deals:[]});
    save('Ο πελάτης προστέθηκε');
  });
}
function editClient(id){
  const c=D.clients.find(x=>x.id===id);
  sheet('Επεξεργασία πελάτη',clientForm(c),w=>{
    const n=val(w,'name'); if(!n){toast('Γράψε επωνυμία');return false;}
    Object.assign(c,{region:val(w,'region'),name:n,city:val(w,'city'),contact:val(w,'contact'),
      phone:val(w,'phone'),email:val(w,'email'),wants:val(w,'wants'),notes:val(w,'notes')});
    save('Αποθηκεύτηκε');
  });
}
function delClient(id){
  ask('Διαγραφή πελάτη και όλου του ιστορικού;',async()=>{
    const c=D.clients.find(x=>x.id===id);
    if(c) for(const d of (c.deals||[])) await dropFile(d.fileId);
    const rid=c?c.region:null;
    D.clients=D.clients.filter(x=>x.id!==id); save('Διαγράφηκε');
    if(rid) openRec('cregion',rid); else go('cli');
  });
}

/* --- πράξη --- */
function dealForm(d){
  const sup=[{v:'',t:'— επίλεξε —'}].concat(D.producers.map(p=>({v:p.id,t:p.name})));
  return `<div class="f2">
      ${fld('ΗΜΕΡΟΜΗΝΙΑ','date',d&&d.date,'','date')}
      ${sel('ΕΙΔΟΣ','kind',d?d.kind:'Πώληση',['Πώληση','Δείγμα','Προσφορά'].map(t=>({v:t,t})))}
    </div>`
    +fld('ΠΡΟΪΟΝ / ΠΑΡΤΙΔΑ','product',d&&d.product,'π.χ. EVOO Κορωνέικη Νοε 2026')
    +`<div class="f2">${fld('ΠΟΣΟΤΗΤΑ (ΤΝ)','qty',d&&d.qty,'22','num')}${fld('ΤΙΜΗ (€/ΚΙΛΟ)','price',d&&d.price,'4,65','num')}</div>`
    +sel('ΑΠΟ ΠΟΙΟΝ ΠΡΟΜΗΘΕΥΤΗ','supplier',d?d.supplier:'',sup)
    +fld('…ή γράψε προμηθευτή','supplierText',d&&d.supplierText,'αν δεν είναι στη λίστα')
    +`<div class="sect">ΑΝΑΛΥΣΗ ΠΟΥ ΣΤΑΛΘΗΚΕ</div>
    <div class="f2">
      ${fld('ΟΞΥΤΗΤΑ (%)','acid',d&&d.acid,'0,30','num')}
      ${fld('ΥΠΕΡΟΞΕΙΔΙΑ','perox',d&&d.perox,'8','num')}
    </div>
    <div class="f2">
      ${fld('K270','k270',d&&d.k270,'0,15','num')}
      ${fld('ΠΟΛΥΦΑΙΝΟΛΕΣ','poly',d&&d.poly,'420','num')}
    </div>`
    +fileFld(d&&d.fileName)
    +area('ΣΗΜΕΙΩΣΕΙΣ','notes',d&&d.notes,'όροι, Incoterm, μεταφορέας, τι είπε ο πελάτης');
}
function dealFrom(w){
  return {date:val(w,'date'),kind:val(w,'kind'),product:val(w,'product'),qty:val(w,'qty'),
    price:val(w,'price'),supplier:val(w,'supplier'),supplierText:val(w,'supplierText'),
    acid:val(w,'acid'),perox:val(w,'perox'),k270:val(w,'k270'),poly:val(w,'poly'),notes:val(w,'notes')};
}
function addDeal(cid){
  const c=D.clients.find(x=>x.id===cid);
  sheet('Νέα πράξη',dealForm({date:new Date().toISOString().slice(0,10)}),async w=>{
    const d=dealFrom(w); if(!d.date){toast('Βάλε ημερομηνία');return false;}
    d.id=uid(); await handleFile(w,d);
    c.deals=c.deals||[]; c.deals.push(d); save('Η πράξη καταχωρήθηκε');
  });
}
function editDeal(cid,did){
  const c=D.clients.find(x=>x.id===cid); const d=c.deals.find(x=>x.id===did);
  sheet('Επεξεργασία πράξης',dealForm(d),async w=>{
    Object.assign(d,dealFrom(w)); await handleFile(w,d); save('Αποθηκεύτηκε');
  });
}
function delDeal(cid,did){
  ask('Διαγραφή πράξης;',async()=>{
    const c=D.clients.find(x=>x.id===cid);
    const d=c.deals.find(x=>x.id===did); await dropFile(d&&d.fileId);
    c.deals=c.deals.filter(x=>x.id!==did); save('Διαγράφηκε'); render();
  });
}

/* --- αντίγραφο ασφαλείας --- */
function openBackup(){
  const oils=D.producers.reduce((s,p)=>s+((p.oils||[]).length),0);
  const files=D.producers.reduce((s,p)=>s+(p.oils||[]).filter(o=>o.fileId).length,0)
             +D.clients.reduce((s,c)=>s+(c.deals||[]).filter(d=>d.fileId).length,0);
  const stats=`${D.producers.length} παραγωγοί · ${oils} λάδια · ${D.clients.length} πελάτες · ${files} αρχεία`;
  const w=document.createElement('div'); w.className='sheet';
  w.innerHTML=`<div class="in">
    <h3>Αντίγραφο ασφαλείας</h3>
    <div class="card"><div class="sub" style="color:var(--ink)">${stats}</div>
      <div class="hint" style="margin-top:6px">Τελευταία εξαγωγή: ${esc(localStorage.getItem(KEY+'-exp')||'ποτέ')}</div></div>
    <button class="btn" id="dl" style="margin-top:12px">Κατέβασε αντίγραφο (.json)</button>
    <div class="hint" style="margin-top:6px">Φύλαξέ το στο iCloud Drive. Τα συνημμένα PDF ΔΕΝ μπαίνουν στο αντίγραφο — κράτα τα ξεχωριστά.</div>
    <div class="sect">ΕΠΑΝΑΦΟΡΑ</div>
    <div class="f"><label>ΔΙΑΛΕΞΕ ΑΡΧΕΙΟ ΑΝΤΙΓΡΑΦΟΥ</label>
      <input type="file" id="up" accept=".json,application/json"></div>
    <div class="hint">Η επαναφορά αντικαθιστά ό,τι υπάρχει τώρα στη συσκευή.</div>
    <div class="acts"><button class="btn" onclick="this.closest('.sheet').remove()">Κλείσιμο</button></div>
    </div>`;
  w.addEventListener('click',e=>{ if(e.target===w) w.remove(); });
  document.body.appendChild(w);
  w.querySelector('#dl').onclick=()=>{
    const d=new Date().toISOString().slice(0,10);
    const blob=new Blob([JSON.stringify(D,null,1)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='doric-'+d+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    try{ localStorage.setItem(KEY+'-exp',d); }catch(e){}
    toast('Το αντίγραφο κατέβηκε');
  };
  w.querySelector('#up').onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const o=JSON.parse(r.result);
        if(!o||typeof o!=='object') throw 0;
        D=Object.assign({pRegions:[],producers:[],cRegions:[],clients:[]},o);
        save('Τα δεδομένα επαναφέρθηκαν'); w.remove(); go('prod');
      }catch(err){ toast('Το αρχείο δεν είναι έγκυρο αντίγραφο'); }
    };
    r.readAsText(f);
  };
}

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

load();
</script>
